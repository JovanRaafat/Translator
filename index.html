<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="css/bootstrap.min.css" />
		<title>multi-translatator</title>
	</head>
	<body>
		<main
			class="min-vh-100 d-flex justify-content-center align-items-center bg-secondary"
		>
			<header
				class="col-12 col-sm-9 col-md-6 col-lg-5 bg-black d-flex justify-content-evenly flex-column align-items-center text-light py-4 gap-3 rounded-2"
			>
				<h1 class="bg-primary p-1 rounded-2">Translator App</h1>
				<section class="d-flex gap-3 flex-sm-row flex-column">
					<!-- input -->
					<div
						class="d-flex flex-column align-items-center justify-content-center gap-2"
					>
						<textarea
							class="bg-secondary border-light border-2 rounded-2 text-light"
							cols="20"
							rows="10"
						></textarea>
						<select class="bg-dark text-light form-select w-75"></select>
					</div>
					<!-- input -->
					<!-- output -->
					<div
						class="d-flex flex-column align-items-center justify-content-center gap-2"
					>
						<textarea
							class="bg-dark border-light border-2 rounded-2 text-light"
							cols="20"
							rows="10"
							disabled
						></textarea>
						<select class="bg-dark text-light form-select w-75"></select>
					</div>
					<!-- output -->
				</section>
				<button class="btn btn-outline-primary">Translate</button>
			</header>
		</main>
		<script src="js/bootstrap.bundle.min.js"></script>
		<script src="js/index.js"></script>
	</body>
</html>
